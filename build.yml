name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p src app/src/main/java/com/example/booster
          mv lib.rs src/
          mv app_build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.kt Native.kt app/src/main/java/com/example/booster/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android" }
      - run: cargo install cargo-ndk
      - run: cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: booster-apk
          path: app/build/outputs/apk/debug/app-debug.apk
